[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "retab"
dynamic = ["version"]
description = "Rust acceleration for ExecuTorch Arm TOSA 1.0 INT preprocessing and serialization"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/apullin/retab"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "retab._native"
