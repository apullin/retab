[executorch]
mode = "stock"
reason = "RETAB patches TOSABackend._preprocess at runtime and falls back to stock preprocess outside its scope, so released ExecuTorch wheels work without a fork."
tested = ["executorch 1.6.0 (v1.6.0-rc4, 4776f71b6)"]

# Every ExecuTorch attribute RETAB replaces, wraps, calls or reads beyond the public
# API, as a dotted path. tests/test_compat_seams.py checks that each one resolves; a
# changed one needs review when the tested ExecuTorch moves.
[executorch.required_seams]
# Replaced while RETAB is installed; stock's is the fallback. TOSABackend.preprocess,
# EthosUBackend and VgfBackend all call it.
preprocess = "executorch.backends.arm.tosa.backend.TOSABackend._preprocess"
# Captured with _preprocess and restored on uninstall.
tosa_preprocess = "executorch.backends.arm.tosa.backend.TOSABackend.preprocess"
# Wrapped to mark Ethos-U compiles. Under the mark RETAB raises this function's
# unused-input error, whose message it copies verbatim.
ethos_u_preprocess = "executorch.backends.arm.ethosu.backend.EthosUBackend.preprocess"
# RETAB's U55 permute split asks rc4's one-TRANSPOSE Vela probe, inside a lowering
# context for the compile spec's TOSA version.
u55_transpose_check = "executorch.backends.arm._passes.decompose_permute_for_u55_pass.DecomposePermuteForU55Pass._violates_exact_constraint"
tosa_lowering_context = "executorch.backends.arm.tosa.specification.TosaLoweringContext"
# The cond/while regions RETAB lowers and scans for symbolic shapes.
cond_while_submodules = "executorch.exir.graph_module.get_cond_while_submodules"
# Registered pass insertions send a graph to stock. RETAB reads this registry and
# treats an ImportError as "none", so a rename would silently drop the fallback.
registered_pass_insertions = "executorch.backends.arm._passes.arm_pass_manager._registered_pass_insertions"

[executorch.opt_in_seams]
# Shadowed on EthosUBackend and VgfBackend only when
# RETAB_PARALLEL_BACKEND_PREPROCESS_WORKERS is above 1; RETAB's serial path copies it.
preprocess_multimethod = "executorch.exir.backend.backend_details.BackendDetails.preprocess_multimethod"

[python]
requires = ">=3.10"
tested = ["3.12"]

[torch]
# ExecuTorch 1.6 imports torchao.prototype.mx_formats whenever TOSABackend is imported;
# torchao 0.18 provides it.
tested = [
  "torch 2.15.0",
  "torchvision 0.29.2",
  "torchao 0.18.0+cpu",
]

[arm]
tested = [
  "ethos-u-vela 5.2.0",
  "tosa-tools 2026.5.0",
  "flatbuffers 25.2.10",
]
